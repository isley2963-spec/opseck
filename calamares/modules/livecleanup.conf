dontChroot: false
timeout: 60
script:
  - /usr/bin/bash -c 'getent passwd zombie >/dev/null && userdel --remove zombie || true'
  - /usr/bin/rm -f /etc/sddm.conf.d/zombie-live.conf
  - /usr/bin/rm -f /etc/systemd/system/zombie-live-user.service
  - /usr/bin/rm -f /etc/systemd/system/multi-user.target.wants/zombie-live-user.service
  - /usr/bin/rm -f /etc/systemd/system/display-manager.service
  - /usr/bin/rm -f /etc/mkinitcpio.conf.d/archiso.conf
  - /usr/bin/rm -f /etc/sudoers.d/zombie-installer
